AllCops:
  NewCops: enable
  SuggestExtensions: false

Lint/InheritException:
  Exclude:
    - lib/configdirector/internal/stoppable_thread.rb

Metrics/BlockLength:
  AllowedMethods:
    - describe

Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/FileName:
  Exclude:
    - lib/configdirector-server-sdk.rb

Style/Documentation:
  Exclude:
    - lib/configdirector/internal/**/*
    - spec/**/*

Style/SymbolProc:
  AllowedMethods:
    - define_method
    - lambda

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
