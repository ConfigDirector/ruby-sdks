AllCops:
  NewCops: enable
  SuggestExtensions: false

Metrics/BlockLength:
  AllowedMethods:
    - describe

Naming/FileName:
  Exclude:
    - lib/configdirector-server-sdk.rb

Style/Documentation:
  Exclude:
    - lib/configdirector/internal/**/*
    - spec/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
