AllCops:
  NewCops: enable
  SuggestExtensions: false

Lint/InheritException:
  Enabled: false

Metrics/BlockLength:
  AllowedMethods:
    - describe
    - shared_context

Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/FileName:
  Regex: '\A(?:[\d[:lower:]_.?!]+|configdirector-server-sdk)\z'

Style/Documentation:
  Include:
    - lib/configdirector.rb
    - lib/configdirector/*.rb
    - lib/configdirector/testing/**/*.rb

Style/SymbolProc:
  AllowedMethods:
    - define_method
    - lambda

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
