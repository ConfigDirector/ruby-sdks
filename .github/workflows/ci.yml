name: ruby-sdks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The checks themselves live in the Makefile so that CI and the pre-push hook cannot drift
# apart. bash everywhere keeps the make recipes portable across the runner images.
defaults:
  run:
    shell: bash

# Each job sets up the newest patch release of its Ruby line, which verify-ruby checks for the
# regular expression fixes of 2026-10-23.
jobs:
  lint:
    name: Lint, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"

      - run: make verify-ruby
      - run: make verify-lock
      - run: make lint
      - run: make test-release
      - run: make build
      - run: make audit

  lowest:
    name: Test (lowest allowed dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"

      - run: make verify-ruby
      - run: make test-lowest

  sdk:
    name: Test configdirector-server-sdk (Ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - os: macos-latest
            ruby: "4.0"
          - os: windows-latest
            ruby: "3.3"
          - os: windows-latest
            ruby: "4.0"
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: make verify-ruby
      - run: make verify-lock GEMS=configdirector-server-sdk SAMPLES=
      - run: make test GEMS=configdirector-server-sdk

  provider:
    name: Test configdirector-openfeature-server-provider (Ruby ${{ matrix.ruby }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: make verify-ruby
      - run: make verify-lock GEMS=configdirector-openfeature-server-provider SAMPLES=
      - run: make test GEMS=configdirector-openfeature-server-provider

  # Each gem's samples on the oldest Ruby line the gem supports and on the newest.
  samples:
    name: Sample apps (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            samples: samples/configdirector-server-sdk/rails
          - ruby: "3.4"
            samples: samples/configdirector-openfeature-server-provider/sinatra
          - ruby: "4.0"
            samples: samples/configdirector-server-sdk/rails samples/configdirector-openfeature-server-provider/sinatra
    env:
      SAMPLE_DIRECTORIES: ${{ matrix.samples }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: make verify-ruby
      - run: make verify-lock GEMS= SAMPLES="$SAMPLE_DIRECTORIES"
      - run: make samples SAMPLES="$SAMPLE_DIRECTORIES"
      - run: make samples-local SAMPLES="$SAMPLE_DIRECTORIES"
